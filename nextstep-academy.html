const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
let files=[],me=null,authMode="login",sessionNotice="",accountNotice="",serverUnavailable=true,installPrompt=null;
async function api(url,options={}){let response;
 try{response=await fetch(url,{credentials:"same-origin",cache:"no-store",...options})}
 catch(e){throw new Error("Cannot connect to the document server. Start it with Start-Nextstep-Academy.bat and try again.")}
 let data={};
 try{data=await response.json()}catch(e){if(response.ok)throw new Error("The server returned an unreadable response.")}
 if(!response.ok){const error=new Error(data.error||"The request could not be completed.");error.status=response.status;throw error}return data}
const opts=(a,sel)=>a.map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join("");
const sysOf=(c,n)=>EDU[c].systems.find(s=>s.n===n);
const stageName=(c,n,l)=>(sysOf(c,n).st.find(x=>x[1].includes(l))||[""])[0];
const isTert=s=>/Tertiary|Higher Education|University|College/.test(s);
const subjGroups=(c,n,l,path)=>{const sn=stageName(c,n,l);if(isTert(sn))return[];const s=(SUBJ[n]||{})[sn];if(!s)return[];
 return Array.isArray(s)?[["Subjects",s]]:Object.entries(s).filter(([k])=>k==="Core"||!path||k===path)};

const lvlOpts=(c,n,sel)=>sysOf(c,n).st.map(([g,l])=>`<optgroup label="${esc(g)}">${opts(l,sel)}</optgroup>`).join("");
const isSenior=l=>/^Grade 1[0-2]$/.test(l||"");

// Cascading country > system > level picker shared by onboarding and upload
function picker(p,v){v=v||{};const c=v.country||Object.keys(EDU)[0];const s=v.system&&EDU[c].systems.some(x=>x.n===v.system)?v.system:EDU[c].systems[0].n;
 return `<div class="row"><div><label for="${p}c">Country</label><select id="${p}c">${opts(Object.keys(EDU),c)}</select></div>
 <div><label for="${p}s">Education system</label><select id="${p}s">${opts(EDU[c].systems.map(x=>x.n),s)}</select></div>
 <div><label for="${p}l">Level</label><select id="${p}l">${lvlOpts(c,s,v.level)}</select></div></div>
 <div id="${p}n" class="note"></div><div id="${p}p" class="hide"><label for="${p}pp">Pathway ${p==="u"?"(optional)":""}</label><select id="${p}pp">${p==="u"?'<option value="">All pathways</option>':""}${opts(PATHS,v.path)}</select></div>`}
function wire(p){const c=$("#"+p+"c"),s=$("#"+p+"s"),l=$("#"+p+"l");
 const upd=()=>{const sy=sysOf(c.value,s.value);$("#"+p+"n").innerHTML=`<b>${esc(sy.n)}:</b> ${esc(sy.note)}<div class="stages">${sy.st.map(x=>`<span class="pill">${esc(x[0])}</span>`).join("")}</div>`;
  $("#"+p+"p").classList.toggle("hide",!(c.value==="Kenya"&&s.value.startsWith("CBC")&&isSenior(l.value)))};
 c.onchange=()=>{s.innerHTML=opts(EDU[c.value].systems.map(x=>x.n));l.innerHTML=lvlOpts(c.value,s.value);upd()};
 s.onchange=()=>{l.innerHTML=lvlOpts(c.value,s.value);upd()};l.onchange=upd;upd()}
const read=p=>({country:$("#"+p+"c").value,system:$("#"+p+"s").value,level:$("#"+p+"l").value,path:$("#"+p+"p").classList.contains("hide")?"":$("#"+p+"pp").value});

function refView(){const{country:c,system:n,level:l,path}=me,g=subjGroups(c,n,l,path);let h="";
 if(g.length)h+=`<div class="card"><h2>Subjects: ${esc(l)}</h2>${g.map(([k,v])=>`<p class="mute" style="margin:8px 0 4px">${esc(k==="Core"?"Core (everyone)":k)}</p><div class="stages">${v.map(s=>`<button class="pill" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>`).join("")}<p class="mute" style="font-size:13px">Tap a subject to filter the downloadable library.</p></div>`;
 const online=[...(isTert(stageName(c,n,l))?UG:G),...(RES[n]||[])].filter((r,i,a)=>a.findIndex(x=>x[1]===r[1])===i);
 h+=`<div class="card"><h2>Online learning resources</h2>${online.map(r=>`<div class="mat"><div><b>${esc(r[0])}</b><small>${esc(KIND[r[2]]||"Resource")} · ${esc(r[3])}</small></div><div class="mat-actions"><a class="pill" href="${esc(r[1])}" target="_blank" rel="noopener">Open resource</a></div></div>`).join("")}</div>`;
 $("#ref").innerHTML=h;document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{$("#q").value=b.dataset.s;list();$("#q").scrollIntoView({behavior:"smooth"})});wireDocumentButtons()}

function header(){$("#who").innerHTML=me?`<span>${esc(me.name)} <span class="tag">${me.role}</span></span><button id="out">Log out</button>`:"";
 if(me)$("#out").onclick=async()=>{try{await api("/api/auth/logout",{method:"POST"});me=null;files=[];sessionNotice="";render()}catch(e){alert("Could not log out: "+e.message)}}}
function render(){header();!me?authView():(me.role==="student"&&!me.level)?onboardView():dashView();
 if(accountNotice){$("#app").insertAdjacentHTML("afterbegin",`<div class="note" role="status">${esc(accountNotice)}</div>`);accountNotice=""}}

function forgotPasswordView(){
  $("#app").innerHTML=`<div class="auth-layout"><section class="hero"><div class="hero-badge">Account recovery</div><h1>Reset your password.</h1><p>Enter the email address connected to your account. If it exists, we will send you a secure reset link immediately.</p></section><div class="card auth-card"><h1>Forgot password?</h1><p class="mute">The reset link is valid for 30 minutes.</p><form id="forgotForm" novalidate><label for="resetEmail">Email address</label><input id="resetEmail" type="email" autocomplete="email" maxlength="254"><div class="note hide" id="resetMailStatus" role="status"></div><div class="err" id="resetError" role="alert" aria-live="polite"></div><div class="note hide" id="resetSuccess" role="status" aria-live="polite"></div><button class="pri" id="sendReset" type="submit" style="width:100%;margin-top:6px">Send reset link</button><button type="button" class="text-button" id="backLogin" style="width:100%;margin-top:12px">Back to login</button></form></div></div>`;
  $("#backLogin").onclick=()=>{authMode="login";authView()};
  api("/api/mail/status").then(result=>{
   if(!result.configured){$("#resetMailStatus").textContent="Email delivery is not configured yet. The site owner must complete secure Gmail setup.";$("#resetMailStatus").classList.remove("hide")}
  }).catch(()=>{})
  $("#forgotForm").onsubmit=async event=>{
   event.preventDefault();
   const email=$("#resetEmail").value.trim().toLowerCase(),error=$("#resetError"),success=$("#resetSuccess"),button=$("#sendReset");
   error.textContent="";success.classList.add("hide");
   if(!/^\S+@\S+\.\S+$/.test(email)){error.textContent="Enter a valid email address.";return}
   button.disabled=true;button.textContent="Sending…";
   try{
    const result=await api("/api/auth/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});
    success.textContent=result.message||"If an account uses that email, a password reset link has been sent.";

function resetPasswordView(token){
  $("#app").innerHTML=`<div class="auth-layout"><section class="hero"><div class="hero-badge">Secure account recovery</div><h1>Choose a new password.</h1><p>Your reset link is protected and expires after 30 minutes.</p></section><div class="card auth-card"><h1>Reset password</h1><p class="mute">Use at least 8 characters.</p><form id="resetPasswordForm" novalidate><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="1024"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="1024"><div class="err" id="newPasswordError" role="alert" aria-live="polite"></div><div class="note hide" id="newPasswordSuccess" role="status" aria-live="polite"></div><button class="pri" id="changePassword" type="submit" style="width:100%;margin-top:6px">Update password</button><button type="button" class="text-button" id="resetBackLogin" style="width:100%;margin-top:12px">Back to login</button></form></div></div>`;
  $("#resetBackLogin").onclick=()=>{history.replaceState({}, "", location.pathname);authMode="login";authView()};
  $("#resetPasswordForm").onsubmit=async event=>{
   event.preventDefault();
   const password=$("#newPassword").value,confirm=$("#confirmPassword").value,error=$("#newPasswordError"),success=$("#newPasswordSuccess"),button=$("#changePassword");
   error.textContent="";success.classList.add("hide");
   if(password.length<8){error.textContent="Password needs at least 8 characters.";return}
   if(password!==confirm){error.textContent="Passwords do not match.";return}
   button.disabled=true;button.textContent="Updating…";
   try{
    await api("/api/auth/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password})});
    success.textContent="Your password has been reset. You can now log in.";
    success.classList.remove("hide");
    history.replaceState({}, "", location.pathname);
   }catch(e){error.textContent=e.message}
   finally{button.disabled=false;button.textContent="Update password"}
  }
}

 <button class="pri" id="sv" style="margin-top:16px">Continue</button></div>`;wire("o");

  $("#ed").onclick=()=>{$("#ewrap").classList.toggle("hide");if(!$("#ec").dataset.w){wire("e");$("#ec").dataset.w=1}};

function list(){const t=me.role==="tutor",q=(document.querySelector("#q")?.value||"").toLowerCase(),all=$("#all")?.checked,kd=$("#kd")?.value;
 const available=t?files: [...LOCAL_MATS,...files];
 const m=available.filter(f=>t?f.by===me.email:( ( !f.country||f.country===me.country)&&(!f.system||f.system===me.system)&&(all||!f.level||f.level===me.level)&&(!f.path||!me.path||f.path===me.path)&&(!kd||(f.kind||"Notes")===kd)&&(f.title+f.subject).toLowerCase().includes(q)));
 $("#list").innerHTML=m.length?m.slice().reverse().map(f=>`<div class="mat"><div><b>${esc(f.title)}</b><small><span class="tag">${esc(f.kind||"Notes")}</span>${esc(f.subject)}${f.level?" · "+esc(f.level):""}${f.path?" · "+esc(f.path):""} · ${esc(f.byName||"Tutor")}${f.date?" · "+esc(f.date):""}</small></div>
  <div class="mat-actions"><a class="pill" href="/api/documents/${encodeURIComponent(f.id)}/open" target="_blank" rel="noopener">Open free</a><button data-d="${esc(f.id)}">Download</button>${t&&!f.local?` <button class="link" data-x="${esc(f.id)}">Delete</button>`:""}</div></div>`).join(""):`<p class="mute">${t?"You haven’t uploaded anything yet.":"No matching materials found."}</p>`;
 wireDocumentButtons();
 document.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this uploaded document?"))return;try{await api("/api/documents/"+encodeURIComponent(b.dataset.x),{method:"DELETE"});await refreshDocuments()}catch(e){alert("Could not delete the document: "+e.message)}})}

function wireDocumentButtons(){
 document.querySelectorAll("[data-d]").forEach(b=>{b.disabled=serverUnavailable;b.title=serverUnavailable?"Reconnect to the document server to download.":"";b.onclick=()=>download(b.dataset.d)});
 document.querySelectorAll('a.pill[href^="/api/documents/"]').forEach(a=>{a.setAttribute("aria-disabled",String(serverUnavailable));if(serverUnavailable)a.tabIndex=-1;else a.removeAttribute("tabindex")})
}

async function refreshDocuments(){try{const result=await api("/api/documents");files=Array.isArray(result.documents)?result.documents:(result.documents?[result.documents]:[]);me=result.account||me;
 serverUnavailable=false;
 if($("#uploadStatus"))$("#uploadStatus").textContent=`Free plan · Verified uploads: ${me.uploadCount||0} · Downloads available: ${me.availableDownloads||0}. Each upload unlocks one download.`;
 const serverStatus=$("#serverStatus");if(serverStatus){serverStatus.classList.add("hide");serverStatus.textContent=""}
 list()}catch(e){
 files=[];serverUnavailable=true;
 if(e.status===401&&me){me=null;sessionNotice="Your session ended. Log in again to continue.";serverUnavailable=false;render();return}
 if($("#list"))list();
 const message="Could not connect to the document server. Start it with Start-Nextstep-Academy.bat, then retry.";
 const status=$("#uploadStatus");if(status)status.textContent=message;
 const error=$("#ue");if(error)error.textContent=message;
 const serverStatus=$("#serverStatus");if(serverStatus){serverStatus.classList.remove("hide");serverStatus.textContent=message+" ";const retry=document.createElement("button");retry.type="button";retry.textContent="Retry";retry.onclick=refreshDocuments;serverStatus.appendChild(retry)}
}}

async function saveProfile(){const button=$("#se"),error=$("#pe");button.disabled=true;error.textContent="";
 try{const result=await api("/api/profile",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(read("e"))});me=result.user;serverUnavailable=false;render()}

function upload(){const file=$("#fl").files[0],title=$("#ti").value.trim(),subject=$("#su").value.trim(),error=$("#ue");
 uploadDocument({file,title,subject,kind:$("#ty").value,error,profile:read("u"),button:$("#ub")})}
function uploadStudent(){const file=$("#sfl").files[0],title=$("#sti").value.trim(),subject=$("#ssu").value.trim(),error=$("#sue");
 uploadDocument({file,title,subject,kind:$("#sty").value,error,profile:me,button:$("#sub")})}
async function uploadDocument({file,title,subject,kind,error,profile,button}){error.textContent="";
 if(!title||!subject||!file){error.textContent="Add a title, subject and a document.";return}
 if(file.size===0||file.size>9*1024*1024){error.textContent="Choose a non-empty document no larger than 9 MB.";return}
 button.disabled=true;button.textContent="Uploading and verifying…";
 try{const metadata={title,subject,kind,fileName:file.name};await api("/api/documents",{method:"POST",headers:{"Content-Type":"application/octet-stream","X-Document-Metadata":encodeURIComponent(JSON.stringify(metadata))},body:file});
  if(profile.country&&profile.system&&profile.level)me={...me,...profile};
  if($("#sfl"))$("#sfl").value="";if($("#fl"))$("#fl").value="";
  if($("#sti"))$("#sti").value="";if($("#ssu"))$("#ssu").value="";
  if($("#ti"))$("#ti").value="";if($("#su"))$("#su").value="";
  error.textContent="Upload verified and available in the shared library.";
  await refreshDocuments()
 }catch(e){error.textContent="Upload failed and no download credit was added: "+e.message}
 finally{button.disabled=false;button.textContent=button.id==="sub"?"Upload and unlock one download":"Upload"}}

async function download(id){const f=[...LOCAL_MATS,...files].find(x=>x.id===id);if(!f)return;
 let leaseId="";
 try{const started=await api("/api/downloads/start/"+encodeURIComponent(id),{method:"POST"});leaseId=started.leaseId;
  const response=await fetch(started.fileUrl,{credentials:"same-origin"});if(!response.ok){let detail="The file could not be retrieved.";try{detail=(await response.json()).error||detail}catch(e){}throw new Error(detail)}
  const blob=await response.blob();if(!blob.size)throw new Error("The document was empty.");
  await api("/api/downloads/complete/"+leaseId,{method:"POST"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=f.name||f.title;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  await refreshDocuments()
 }catch(e){if(leaseId){try{await api("/api/downloads/cancel/"+leaseId,{method:"POST"})}catch(cancelError){console.error("Could not cancel the failed download reservation.",cancelError)}}
  await refreshDocuments();alert("Download failed. You can try again; incomplete transfers do not use a download credit. "+e.message)}}

function wireFeedback(){const b=$("#sendFeedback");if(!b)return;api("/api/mail/status").then(result=>{if(!result.configured){const note=document.createElement("div");note.className="note";note.setAttribute("role","status");note.textContent="Email delivery is not configured yet. Feedback will fail until secure Gmail setup is completed.";b.before(note)}}).catch(()=>{});b.onclick=async()=>{const name=$("#feedbackName").value.trim(),email=$("#feedbackEmail").value.trim(),message=$("#feedbackMessage").value.trim(),err=$("#feedbackErr"),success=$("#feedbackSuccess");err.textContent="";success.classList.add("hide");if(!name||!email||!message)return err.textContent="Please add your name, email and message.";if(!/^\S+@\S+\.\S+$/.test(email))return err.textContent="Enter a valid email address.";b.disabled=true;b.textContent="Sending…";try{await api("/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,email,message})});$("#feedbackMessage").value="";success.textContent="Thanks! Your feedback has been sent.";success.classList.remove("hide")}catch(e){err.textContent=e.message}finally{b.disabled=false;b.textContent="Send feedback"}}}

function startCampusSlideshow(){
 const backdrop=$("#campus-backdrop"),credit=$("#campus-credit");let current=0;
 const showSlide=()=>{const slide=CAMPUS_SLIDES[current];backdrop.style.backgroundImage=`linear-gradient(rgba(17,29,49,.48),rgba(17,29,49,.38)),url("${slide.image}")`;
  credit.innerHTML=`Photo: <a href="${slide.source}" target="_blank" rel="noopener">${slide.caption}</a> by ${slide.author} · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>`;
  current=(current+1)%CAMPUS_SLIDES.length};
 showSlide();
 if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 window.setInterval(()=>{backdrop.classList.add("is-changing");window.setTimeout(()=>{showSlide();backdrop.classList.remove("is-changing")},800)},9000)
}
